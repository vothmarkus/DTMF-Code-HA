name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Compile integration
        run: python -m compileall -q custom_components/dtmf_code

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Home Assistant validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: description topics

  tailscale_sft1200_noupx:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Set up Go 1.25.11
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
          cache: false

      - name: Clone package builder
        run: git clone --depth 1 https://github.com/lanrat/openwrt-tailscale-repo.git builder

      - name: Disable UPX and build mips_siflower package
        env:
          ARCH: mips_siflower
          BRANCH: v1.96.4
          PKG_RELEASE: '3'
          GO_VERSION: go1.25.11
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('builder/build.sh')
          s = p.read_text()
          old = '''    if command -v upx &> /dev/null; then
                  upx --lzma --best "tailscale.${arch}.combined"
              else
                  echo "upx not found, skipping compression"
              fi'''
          if old not in s:
              raise SystemExit('Expected UPX block not found in upstream build.sh')
          p.write_text(s.replace(old, '    echo "UPX compression disabled for GL-SFT1200 compatibility"'))
          PY
          cd builder
          ./build.sh force

      - name: Verify package
        run: |
          set -euxo pipefail
          PKG=builder/packages/19.07/tailscale_1.96.4_mips_siflower.ipk
          test -s "$PKG"
          mkdir -p verify/control verify/data
          tar -xzf "$PKG" -C verify
          tar -xzf verify/control.tar.gz -C verify/control
          tar -xzf verify/data.tar.gz -C verify/data
          cat verify/control/control
          grep -q '^Version: 1.96.4-3$' verify/control/control
          grep -q '^Architecture: mips_siflower$' verify/control/control
          BIN=verify/data/usr/sbin/tailscaled
          file "$BIN"
          SIZE=$(stat -c '%s' "$BIN")
          echo "tailscaled size: $SIZE bytes"
          test "$SIZE" -gt 20000000
          cp "$PKG" tailscale_1.96.4-3_mips_siflower_noupx.ipk
          sha256sum tailscale_1.96.4-3_mips_siflower_noupx.ipk > tailscale_1.96.4-3_mips_siflower_noupx.ipk.sha256
          cat tailscale_1.96.4-3_mips_siflower_noupx.ipk.sha256

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-sft1200-1.96.4-3-noupx
          path: |
            tailscale_1.96.4-3_mips_siflower_noupx.ipk
            tailscale_1.96.4-3_mips_siflower_noupx.ipk.sha256
          if-no-files-found: error
          retention-days: 7
